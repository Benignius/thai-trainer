<style>
:root {
  --bg: #0f0e0c;
  --surface: #1a1916;
  --surface2: #242220;
  --surface3: #2e2c29;
  --border: rgba(255,255,255,0.08);
  --border2: rgba(255,255,255,0.14);
  --text: #f0ede8;
  --text2: #a09a90;
  --text3: #6b6560;
  --gold: #d4a843;
  --gold-dim: rgba(212,168,67,0.15);
  --teal: #4dbfa0;
  --teal-dim: rgba(77,191,160,0.12);
  --red: #e0604a;
  --red-dim: rgba(224,96,74,0.12);
  --f1: #e05c3a; --f2: #d4a843; --f3: #6bb86b; --f4: #4da8d4; --f5: #9b6bd4;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; overflow-x: hidden; }

/* Layout */
.app { max-width: 680px; margin: 0 auto; padding: 0 16px 80px; }
.topbar { display: flex; align-items: center; justify-content: space-between; padding: 20px 0 24px; }
.logo { font-family: 'Instrument Serif', serif; font-size: 22px; color: var(--text); letter-spacing: -0.02em; }
.logo span { color: var(--gold); }
.nav-btn { background: transparent; border: 0.5px solid var(--border2); border-radius: 8px; color: var(--text2); padding: 7px 14px; font-family: 'DM Sans', sans-serif; font-size: 13px; cursor: pointer; transition: all 0.15s; }
.nav-btn:hover { background: var(--surface2); color: var(--text); }
.nav-btn.active { background: var(--gold-dim); border-color: var(--gold); color: var(--gold); }

/* Boxes (Fächer) */
.boxes-grid { display: grid; grid-template-columns: repeat(5,1fr); gap: 10px; margin-bottom: 28px; }
.box { background: var(--surface); border: 0.5px solid var(--border); border-radius: 12px; padding: 14px 10px; text-align: center; cursor: pointer; transition: all 0.18s; position: relative; }
.box:hover { border-color: var(--border2); transform: translateY(-1px); }
.box.active { transform: translateY(-2px); }
.box-num { font-size: 11px; color: var(--text3); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.08em; }
.box-count { font-size: 22px; font-weight: 500; }
.box-label { font-size: 11px; color: var(--text3); margin-top: 4px; }
.box-dot { width: 6px; height: 6px; border-radius: 50%; margin: 0 auto 8px; }
.box:nth-child(1) .box-dot { background: var(--f1); }
.box:nth-child(2) .box-dot { background: var(--f2); }
.box:nth-child(3) .box-dot { background: var(--f3); }
.box:nth-child(4) .box-dot { background: var(--f4); }
.box:nth-child(5) .box-dot { background: var(--f5); }
.box:nth-child(1) .box-count { color: var(--f1); }
.box:nth-child(2) .box-count { color: var(--f2); }
.box:nth-child(3) .box-count { color: var(--f3); }
.box:nth-child(4) .box-count { color: var(--f4); }
.box:nth-child(5) .box-count { color: var(--f5); }

/* Due badge */
.due-badge { position: absolute; top: -5px; right: -5px; background: var(--gold); color: #0f0e0c; font-size: 10px; font-weight: 600; border-radius: 99px; padding: 2px 6px; }

/* Stats bar */
.statsbar { display: flex; gap: 10px; margin-bottom: 24px; }
.stat-pill { background: var(--surface); border: 0.5px solid var(--border); border-radius: 8px; padding: 10px 16px; flex: 1; }
.stat-pill .n { font-size: 20px; font-weight: 500; color: var(--text); }
.stat-pill .l { font-size: 11px; color: var(--text3); margin-top: 2px; text-transform: uppercase; letter-spacing: 0.06em; }

/* Card */
.card-wrap { perspective: 1200px; }
.card { background: var(--surface); border: 0.5px solid var(--border2); border-radius: 18px; padding: 48px 32px; text-align: center; cursor: pointer; transition: border-color 0.2s, transform 0.05s; min-height: 260px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
.card:hover { border-color: rgba(255,255,255,0.2); }
.card:active { transform: scale(0.99); }
.card-cat { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 16px; }
.card-de { font-family: 'Instrument Serif', serif; font-size: 42px; color: var(--text); line-height: 1.1; margin-bottom: 6px; }
.card-hint { font-size: 13px; color: var(--text3); margin-top: 12px; }
.card-th { font-size: 36px; color: var(--teal); margin-bottom: 8px; line-height: 1.3; }
.card-ph { font-size: 16px; color: var(--text2); font-style: italic; margin-bottom: 8px; }
.card-de-small { font-size: 14px; color: var(--text3); margin-top: 4px; }
.card-box-indicator { position: absolute; top: 16px; right: 18px; font-size: 11px; color: var(--text3); display: flex; align-items: center; gap: 5px; }
.box-pip { width: 8px; height: 8px; border-radius: 50%; }

/* Buttons */
.btn-row { display: flex; gap: 10px; margin-top: 16px; }
.btn { flex: 1; padding: 14px 20px; border-radius: 12px; border: 0.5px solid var(--border2); background: var(--surface); font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 500; cursor: pointer; color: var(--text); transition: all 0.15s; display: flex; align-items: center; justify-content: center; gap: 8px; }
.btn:hover { background: var(--surface2); }
.btn:active { transform: scale(0.97); }
.btn-correct { border-color: var(--teal); color: var(--teal); background: var(--teal-dim); }
.btn-correct:hover { background: rgba(77,191,160,0.22); }
.btn-wrong { border-color: var(--red); color: var(--red); background: var(--red-dim); }
.btn-wrong:hover { background: rgba(224,96,74,0.22); }
.btn-primary { background: var(--gold-dim); border-color: var(--gold); color: var(--gold); }
.btn-primary:hover { background: rgba(212,168,67,0.25); }

/* Section headers */
.section-head { font-size: 13px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 14px; }

/* Due info */
.due-info { background: var(--surface); border: 0.5px solid var(--border); border-radius: 12px; padding: 16px 20px; margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; }
.due-info .count { font-size: 28px; font-weight: 500; color: var(--gold); }
.due-info .desc { font-size: 13px; color: var(--text2); margin-top: 2px; }

/* Progress in card session */
.session-progress { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
.prog-bar { flex: 1; height: 3px; background: var(--surface3); border-radius: 99px; overflow: hidden; }
.prog-fill { height: 100%; background: var(--gold); transition: width 0.4s ease; border-radius: 99px; }
.prog-label { font-size: 12px; color: var(--text3); min-width: 50px; text-align: right; }

/* Empty state */
.empty { text-align: center; padding: 60px 20px; }
.empty-icon { font-size: 48px; margin-bottom: 16px; }
.empty-title { font-family: 'Instrument Serif', serif; font-size: 26px; color: var(--text); margin-bottom: 8px; }
.empty-sub { font-size: 14px; color: var(--text2); }

/* Category chips */
.cat-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
.chip { padding: 5px 12px; border-radius: 99px; border: 0.5px solid var(--border); background: transparent; font-size: 12px; color: var(--text2); cursor: pointer; font-family: 'DM Sans', sans-serif; transition: all 0.15s; }
.chip.active { border-color: var(--gold); background: var(--gold-dim); color: var(--gold); }

/* Toast */
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--surface2); border: 0.5px solid var(--border2); border-radius: 99px; padding: 10px 20px; font-size: 13px; color: var(--text); transition: transform 0.3s ease; z-index: 999; white-space: nowrap; }
.toast.show { transform: translateX(-50%) translateY(0); }

/* Result */
.result-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: 18px; padding: 40px 32px; text-align: center; }
.result-big { font-family: 'Instrument Serif', serif; font-size: 64px; color: var(--gold); line-height: 1; margin-bottom: 8px; }
.result-sub { font-size: 15px; color: var(--text2); margin-bottom: 28px; }
.result-row { display: flex; gap: 10px; margin-bottom: 24px; }
.result-stat { flex: 1; background: var(--surface2); border-radius: 10px; padding: 14px; text-align: center; }
.result-stat .n { font-size: 24px; font-weight: 500; }
.result-stat .l { font-size: 11px; color: var(--text3); margin-top: 2px; }

/* Info box */
.info-box { background: var(--surface); border: 0.5px solid var(--border); border-radius: 12px; padding: 16px 20px; margin-bottom: 16px; }
.info-box h3 { font-size: 14px; font-weight: 500; margin-bottom: 8px; color: var(--text); }
.info-box p { font-size: 13px; color: var(--text2); line-height: 1.6; }
.phase-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 0.5px solid var(--border); }
.phase-row:last-child { border-bottom: none; }
.phase-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.phase-text { font-size: 13px; color: var(--text2); }
.phase-days { font-size: 12px; color: var(--text3); margin-left: auto; }
.btn-star { border-color: #d4a843; color: #d4a843; background: rgba(212,168,67,0.1); }
.btn-star:hover { background: rgba(212,168,67,0.22); }
.btn-star.active { background: #d4a843 !important; color: #0f0e0c !important; }
.btn-later { border-color: #6b6560; color: #a09a90; background: rgba(107,101,96,0.1); }
.btn-later:hover { background: rgba(107,101,96,0.22); }
.btn-later.active { background: #6b6560 !important; color: #f0ede8 !important; }
.btn-now { border-color: #e0604a; color: #e0604a; background: rgba(224,96,74,0.1); }
.btn-now:hover { background: rgba(224,96,74,0.22); }
.btn-now.active { background: #e0604a !important; color: #fff !important; }

/* Animations */
@keyframes slideUp { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
.animate-in { animation: slideUp 0.25s ease forwards; }
@keyframes flashGreen { 0%,100% { background: var(--surface); } 50% { background: var(--teal-dim); } }
@keyframes flashRed { 0%,100% { background: var(--surface); } 50% { background: var(--red-dim); } }
.flash-correct { animation: flashGreen 0.35s ease; }
.flash-wrong { animation: flashRed 0.35s ease; }

  const cards = ALL_VOCAB.map((v, i) => ({
    id: i,
    th: v[0], ph: v[1], de: v[2], cat: v[3],
    box: 0,
    nextReview: Date.now(),
    lastReview: null,
    timesCorrect: 0,
    timesWrong: 0,
    priority: 'normal',
  }));
  return { cards, session: null, lastSeen: {} };
}

function loadState() {
  try {
    const s = localStorage.getItem(STORAGE_KEY);
    if (s) {
      const parsed = JSON.parse(s);
      // migrate: add priority if missing
      if (parsed.cards) {
        parsed.cards.forEach(c => { if (!c.priority) c.priority = 'normal'; });
      }
      // migrate if vocab grew
      if (parsed.cards && parsed.cards.length < ALL_VOCAB.length) {
        const extra = ALL_VOCAB.slice(parsed.cards.length).map((v, i) => ({
          id: parsed.cards.length + i,
          th: v[0], ph: v[1], de: v[2], cat: v[3],
          box: 0, nextReview: Date.now(), lastReview: null,
          timesCorrect: 0, timesWrong: 0, priority: 'normal',
        }));
        parsed.cards = parsed.cards.concat(extra);
      }
      return parsed;
    }
  } catch(e) {}
  return defaultState();
}

function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
}

function getDue() {
  const now = Date.now();
  const due = state.cards.filter(c => c.priority !== 'later' && c.priority !== 'now' && c.nextReview <= now);
  due.sort((a, b) => {
    if (a.priority === 'important' && b.priority !== 'important') return -1;
    if (b.priority === 'important' && a.priority !== 'important') return 1;
    return a.nextReview - b.nextReview;
  });
  return due;
}

function setPriority(id, p) {
  const card = state.cards.find(c => c.id === id);
  if (!card) return;
  card.priority = card.priority === p ? 'normal' : p;
  if (card.priority === 'later') {
    card.nextReview = Date.now() + 365 * 86400000;
  } else if (card.priority === 'important' || card.priority === 'now') {
    card.nextReview = Date.now();
  }
  saveState();
}

function getBoxCounts() {
  const counts = [0,0,0,0,0];
  state.cards.forEach(c => { if(c.box >= 0 && c.box < 5 && c.priority !== 'later') counts[c.box]++; });
  return counts;
}

function getDueByBox() {
  const now = Date.now();
  const due = [0,0,0,0,0];
  state.cards.forEach(c => {
    if(c.box >= 0 && c.box < 5 && c.nextReview <= now) due[c.box]++;
  });
  return due;
}

// ===================== SESSION =====================
let sessionCards = [];
let sessionIdx = 0;
let sessionCorrect = 0;
let sessionWrong = 0;
let cardFlipped = false;

function startSession(fromBox) {
  const now = Date.now();
  let pool;
  if (fromBox === 'now') {
    pool = state.cards.filter(c => c.priority === 'now');
    if (!pool.length) { showToast('Keine Karten im Jetzt-Fach'); return; }
  } else if (fromBox !== undefined) {
    pool = state.cards.filter(c => c.box === fromBox && c.nextReview <= now);
    if (!pool.length) pool = state.cards.filter(c => c.box === fromBox);
  } else {
    pool = getDue();
    if (!pool.length) pool = shuffle(state.cards.filter(c => c.priority !== 'later')).slice(0, 20);
  }
  sessionCards = shuffle(pool).slice(0, 30);
  sessionIdx = 0;
  sessionCorrect = 0;
  sessionWrong = 0;
  cardFlipped = false;
  renderCard();
}

function answerCard(correct) {
  const card = sessionCards[sessionIdx];
  if (correct) {
    card.box = Math.min(card.box + 1, 4);
    card.timesCorrect++;
    sessionCorrect++;
    // Karte wandert ins reguläre Leitner-System zurück
    if (card.priority === 'now') card.priority = 'normal';
  } else {
    card.box = 0;
    card.timesWrong++;
    sessionWrong++;
    // bei Falsch bleibt sie im Jetzt-Fach, damit sie gleich wiederholt wird
  }
  const days = INTERVALS[card.box];
  card.nextReview = Date.now() + days * 86400000;
  card.lastReview = Date.now();
  saveState();
  sessionIdx++;
  cardFlipped = false;

  if (sessionIdx >= sessionCards.length) {
    showSessionResult();
  } else {
    renderCard();
    updateProgress();
  }
}

function skipCard() {
  sessionIdx++;
  cardFlipped = false;
  if (sessionIdx >= sessionCards.length) {
    showSessionResult();
  } else {
    renderCard();
  }
}

function flipCard() {
  cardFlipped = true;
  document.getElementById('card-front-de').style.display = 'none';
  document.getElementById('card-back').style.display = 'block';
  document.getElementById('card-hint').style.display = 'none';
  document.getElementById('card-flip-btn').style.display = 'none';
  document.getElementById('card-answer-btns').style.display = 'flex';
  // auto-play Thai pronunciation
  const cur = sessionCards[sessionIdx];
  if (cur) speakThai(cur.th);
}

// ===================== AUDIO =====================
let audioEnabled = true;

function findThaiVoice() {
  const voices = window.speechSynthesis.getVoices();
  return voices.find(v => v.lang === 'th-TH')
      || voices.find(v => v.lang === 'th')
      || voices.find(v => v.lang.startsWith('th'))
      || null;
}

function speakThai(text) {
  if (!audioEnabled) return;
  if (!window.speechSynthesis) {
    showToast('Kein Audio-Support in diesem Browser');
    return;
  }
  window.speechSynthesis.cancel();
  setTimeout(function() {
    var utt = new SpeechSynthesisUtterance(text);
    utt.lang = 'th-TH';
    utt.rate = 0.8;
    utt.pitch = 1.0;
    utt.volume = 1.0;
    var voice = findThaiVoice();
    if (voice) utt.voice = voice;
    utt.onerror = function(e) { console.warn('TTS error:', e.error); };
    window.speechSynthesis.speak(utt);
  }, 150);
}

function speakCurrent() {
  var card = sessionCards[sessionIdx];
  if (card) speakThai(card.th);
}

function testAudio() {
  var voice = findThaiVoice();
  showToast(voice ? '&#128266; Stimme: ' + voice.name : '&#9888; Keine Thai-Stimme gefunden');
  speakThai('สวัสดีครับ');
}

function testVoiceByIdx(idx) {
  var voices = window.speechSynthesis.getVoices();
  var v = voices[idx];
  if (!v) return;
  window.speechSynthesis.cancel();
  setTimeout(function() {
    var utt = new SpeechSynthesisUtterance('สวัสดีครับ');
    utt.voice = v;
    utt.lang = v.lang;
    utt.rate = 0.8;
    window.speechSynthesis.speak(utt);
    showToast('Teste: ' + v.name);
  }, 150);
}

function showVoices() {
  var el = document.getElementById('voice-list');
  if (!el) return;
  if (el.style.display === 'block') { el.style.display = 'none'; return; }
  var voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
  if (voices.length === 0) {
    el.innerHTML = '<span style="color:var(--red)">Keine Stimmen geladen &#8211; Seite neu laden.</span>';
    el.style.display = 'block';
    return;
  }
  var thaiCount = voices.filter(function(v){ return v.lang.startsWith('th'); }).length;
  var html = '<strong style="color:var(--text)">Stimmen: ' + voices.length + ' total, ' + thaiCount + ' Thai &#8211; klicken zum Testen:</strong><br><br>';
  voices.forEach(function(v, i) {
    var isThai = v.lang.startsWith('th');
    html += '<span style="color:' + (isThai ? 'var(--teal)' : 'var(--text3)')
          + ';cursor:pointer;display:block;padding:2px 0" onclick="testVoiceByIdx(' + i + ')">'
          + (isThai ? '&#9733; ' : '&#9675; ') + v.name + ' [' + v.lang + ']</span>';
  });
  if (thaiCount === 0) {
    html += '<br><span style="color:var(--red)">&#9888; Keine Thai-Stimme!</span><br>'
          + '<span style="color:var(--text2);font-size:12px">Windows: Einstellungen &#8594; Zeit &amp; Sprache &#8594; Sprache &#8594; Thai hinzufügen &#8594; neu starten</span>';
  }
  el.innerHTML = html;
  el.style.display = 'block';
}

// Pre-load voices early
if (window.speechSynthesis) {
  window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged = function() { window.speechSynthesis.getVoices(); };
}

// ===================== BROWSE =====================
let browseFilter = '';
let browseSearch = '';

function addCustomCard() {
  const de = document.getElementById('inp-de').value.trim();
  const th = document.getElementById('inp-th').value.trim();
  const ph = document.getElementById('inp-ph').value.trim();
  const cat = document.getElementById('inp-cat').value.trim() || 'Eigene';
  if (!de || !th) { showToast('Bitte Deutsch und Thai ausfüllen'); return; }
  const newCard = {
    id: Date.now(),
    th, ph, de, cat,
    box: 0,
    nextReview: Date.now(),
    lastReview: null,
    timesCorrect: 0,
    timesWrong: 0,
    priority: 'important',
    custom: true,
  };
  state.cards.push(newCard);
  saveState();
  document.getElementById('inp-de').value = '';
  document.getElementById('inp-th').value = '';
  document.getElementById('inp-ph').value = '';
  document.getElementById('inp-cat').value = '';
  showToast('✓ Karte gespeichert und als wichtig markiert');
  renderBrowseList();
}

function deleteCustomCard(id) {
  if (!confirm('Karte löschen?')) return;
  state.cards = state.cards.filter(c => c.id !== id);
  saveState();
  renderBrowseList();
}

function setCat(cat) {
  browseFilter = cat;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  event.target.classList.add('active');
  renderBrowseList();
}

function renderBrowseList() {
  const search = browseSearch.toLowerCase();
  let filtered = state.cards.filter(c => {
    const catOk = !browseFilter || c.cat === browseFilter;
    const searchOk = !search || c.de.toLowerCase().includes(search) || c.th.includes(search) || c.ph.toLowerCase().includes(search);
    return catOk && searchOk;
  });
  // Sort: custom/important first
  filtered.sort((a,b) => {
    if (a.custom && !b.custom) return -1;
    if (b.custom && !a.custom) return 1;
    if (a.priority==='important' && b.priority!=='important') return -1;
    if (b.priority==='important' && a.priority!=='important') return 1;
    return 0;
  });
  const html = filtered.slice(0,100).map(c => {
    const boxColors = ['var(--f1)','var(--f2)','var(--f3)','var(--f4)','var(--f5)'];
    return `<div data-th="${c.th}" style="display:flex;align-items:center;padding:10px 0;border-bottom:0.5px solid var(--border);gap:8px${c.custom?' background:rgba(212,168,67,0.04);border-radius:6px;padding-left:6px;padding-right:6px':''}">
      <div style="flex:1">
        <span style="font-size:15px;color:var(--text)">${c.de}</span>${c.custom ? ' <span style="font-size:10px;color:var(--gold);border:0.5px solid var(--gold);border-radius:4px;padding:1px 5px;vertical-align:middle">Eigene</span>' : ''}

function exportData() {
  const data = JSON.stringify(state, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const date = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = 'thai-trainer-backup-' + date + '.json';
  a.click();
  URL.revokeObjectURL(url);
  showToast('Backup heruntergeladen!');
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const parsed = JSON.parse(e.target.result);
      if (!parsed.cards || !Array.isArray(parsed.cards)) throw new Error('Ungültiges Format');
      // merge priority & custom fields if missing
      parsed.cards.forEach(c => {
        if (!c.priority) c.priority = 'normal';
      });
      state = parsed;
      saveState();
      showToast('✓ Backup erfolgreich geladen! ' + state.cards.length + ' Karten importiert.');
      renderInfo();
      renderLearn();
    } catch(err) {
      showToast('Fehler: Ungültige Backup-Datei');
    }
  };
  reader.readAsText(file);
  // reset input so same file can be re-imported
  event.target.value = '';
}

function normalizeForDupeCheck(s) {
  return (s || '').trim().toLowerCase().replace(/\s+/g, ' ');
}

// ===================== GOOGLE DRIVE SYNC =====================
const GDRIVE_CLIENT_ID = ''; // set by user
const GDRIVE_FILE_NAME = 'thai-trainer-sync.json';
const GDRIVE_SCOPES = 'https://www.googleapis.com/auth/drive.appdata';
let gdriveToken = null;
let gdriveClientId = localStorage.getItem('gdrive_client_id') || '';

function saveClientId() {
  const input = document.getElementById('gdrive-client-id-input');
  if (!input) return;
  const val = input.value.trim();
  if (!val) { showToast('Bitte Client-ID eingeben'); return; }
  gdriveClientId = val;
  localStorage.setItem('gdrive_client_id', val);
  showToast('Client-ID gespeichert');
  renderInfo();
}

function gdriveSignIn(callback) {
  if (!gdriveClientId) {
    showToast('Bitte zuerst Google Client-ID eingeben');
    return;
  }
  const client = google.accounts.oauth2.initTokenClient({
    client_id: gdriveClientId,
    scope: GDRIVE_SCOPES,
    callback: (resp) => {
      if (resp.error) { showToast('Anmeldung fehlgeschlagen: ' + resp.error); return; }
      gdriveToken = resp.access_token;
      if (callback) callback();
    }
  });
  client.requestAccessToken();
}

async function gdriveFindFile() {
  const resp = await fetch(
    'https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=name%3D%22' + GDRIVE_FILE_NAME + '%22&fields=files(id,name,modifiedTime)',
    { headers: { Authorization: 'Bearer ' + gdriveToken } }
  );
  const data = await resp.json();
  return data.files && data.files.length > 0 ? data.files[0] : null;
}

async function gdriveSave() {
  const btn = document.getElementById('gdrive-save-btn');
  if (btn) btn.textContent = 'Speichert...';
  try {
    const existing = await gdriveFindFile();
    const body = JSON.stringify(state);
    const metadata = JSON.stringify({ name: GDRIVE_FILE_NAME, parents: ['appDataFolder'] });
    const form = new FormData();
    form.append('metadata', new Blob([metadata], { type: 'application/json' }));
    form.append('file', new Blob([body], { type: 'application/json' }));

    let url = 'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart';
    let method = 'POST';
    if (existing) {
      url = 'https://www.googleapis.com/upload/drive/v3/files/' + existing.id + '?uploadType=multipart';
      method = 'PATCH';
    }
    const resp = await fetch(url, { method, headers: { Authorization: 'Bearer ' + gdriveToken }, body: form });
    if (!resp.ok) throw new Error(resp.status);
    const now = new Date().toLocaleTimeString('de-CH');
    showToast('&#10003; In Google Drive gespeichert (' + now + ')');
    if (btn) btn.textContent = '&#9650; In Drive speichern';
    renderInfo();
  } catch(e) {
    showToast('Fehler beim Speichern: ' + e.message);
    if (btn) btn.textContent = '&#9650; In Drive speichern';
  }
}

async function gdriveLoad() {
  const btn = document.getElementById('gdrive-load-btn');
  if (btn) btn.textContent = 'Lädt...';
  try {
    const file = await gdriveFindFile();
    if (!file) { showToast('Keine Sync-Datei in Drive gefunden'); if (btn) btn.textContent = '&#9660; Von Drive laden'; return; }
    const resp = await fetch('https://www.googleapis.com/drive/v3/files/' + file.id + '?alt=media',
      { headers: { Authorization: 'Bearer ' + gdriveToken } });
    const parsed = await resp.json();
    if (!parsed.cards) throw new Error('Ungültige Datei');
    parsed.cards.forEach(c => { if (!c.priority) c.priority = 'normal'; });
    state = parsed;
    saveState();
    const mod = new Date(file.modifiedTime).toLocaleString('de-CH');
    showToast('&#10003; Geladen! Stand: ' + mod);
    if (btn) btn.textContent = '&#9660; Von Drive laden';
    renderLearn();
    renderInfo();
  } catch(e) {
    showToast('Fehler beim Laden: ' + e.message);
    if (btn) btn.textContent = '&#9660; Von Drive laden';
  }
}

function gdriveSaveClick() { gdriveToken ? gdriveSave() : gdriveSignIn(gdriveSave); }
function gdriveLoadClick() { gdriveToken ? gdriveLoad() : gdriveSignIn(gdriveLoad); }

function findDuplicates() {
  // group by Thai text (most reliable) AND by German text
  const byThai = {};
  const byDe = {};
  state.cards.forEach(c => {
    const th = normalizeForDupeCheck(c.th);
    const de = normalizeForDupeCheck(c.de);
    if (th) { (byThai[th] = byThai[th] || []).push(c); }
    if (de) { (byDe[de] = byDe[de] || []).push(c); }
  });

  const dupeGroups = [];
  const seenIds = new Set();

  Object.values(byThai).forEach(group => {
    if (group.length > 1) {
      dupeGroups.push({ key: group[0].th, type: 'Thai', cards: group });
      group.forEach(c => seenIds.add(c.id));
    }
  });
  Object.values(byDe).forEach(group => {
    if (group.length > 1) {
      // avoid re-listing groups already fully covered by Thai-match
      const allSeen = group.every(c => seenIds.has(c.id));
      if (!allSeen) {
        dupeGroups.push({ key: group[0].de, type: 'Deutsch', cards: group });
      }
    }
  });

  return dupeGroups;
}

function deleteCardById(id) {
  state.cards = state.cards.filter(c => c.id !== id);
  saveState();
  renderDuplicates();
}

function renderDuplicates() {
  const el = document.getElementById('dupe-results');

    el.style.display = 'block';

function shuffle(arr) {
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}
